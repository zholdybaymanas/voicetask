<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>VoiceTask</title>
    <meta name="description" content="Голосовой таск-менеджер для команды" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Default to the dark theme bg; updated dynamically by ThemeContext -->
    <meta name="theme-color" content="#0F1117" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA — apple-touch-icon must be PNG; iOS Safari ignores SVG and
         falls back to a generic browser screenshot if only SVG is provided. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VoiceTask" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Apply saved theme synchronously to prevent FOUC on reload -->
    <script>
      (function () {
        var valid = ['dark','cloud-dancer','mocha','ocean','midnight-purple'];
        var t = null;
        try { t = localStorage.getItem('voicetask:theme'); } catch (e) {}
        if (!t || valid.indexOf(t) === -1) t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Регистрация Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => console.log('SW зарегистрирован:', reg.scope))
            .catch((err) => console.error('SW ошибка:', err));
        });
      }
    </script>
  </body>
</html>
